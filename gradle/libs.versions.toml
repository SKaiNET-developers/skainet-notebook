[versions]
kotlin = "2.3.21"
shadow = "9.3.1"
skainet = "0.22.1"
dokka = "2.1.0"
kotlinJupyter = "0.19.0-945"
# JVM-side WebAssembly runtime for Graphviz rendering. See
# kotlin-notebook/src/main/resources/sk/ainet/app/notebook/wasm/README.md
# for how the bundled .wasm is produced.
chasm = "1.4.5"
weh = "0.6.0"


[libraries]
# WebAssembly runtime (pure-Kotlin, Wasm 3.0). Used by GraphvizWasm to execute
# the bundled graphviz.wasm entirely on the JVM kernel — no JS evaluation in
# notebook cells.
chasm-runtime = { module = "io.github.charlietap.chasm:chasm", version.ref = "chasm" }
# WASI Preview 1 host implementation for chasm. Covers fd_*/clock_*/random_*/
# environ_*/proc_exit — what a wasi-sdk-built Graphviz imports. The Emscripten
# variant is the fallback path for an unmodified hpcc-js wasm (see scaffold
# notes in GraphvizWasm.kt).
weh-bindings-chasm-wasip1 = { module = "at.released.weh:bindings-chasm-wasip1", version.ref = "weh" }
weh-bindings-chasm-emscripten = { module = "at.released.weh:bindings-chasm-emscripten", version.ref = "weh" }

skainet-lang-core = { module = "sk.ainet.core:skainet-lang-core", version.ref = "skainet" }
skainet-lang-models = { module = "sk.ainet.core:skainet-lang-models", version.ref = "skainet" }
skainet-model-yolo = { module = "sk.ainet.core:skainet-model-yolo", version.ref = "skainet" }
skainet-lang-dag = { module = "sk.ainet.core:skainet-lang-dag", version.ref = "skainet" }
skainet-compile-core = { module = "sk.ainet.core:skainet-compile-core", version.ref = "skainet" }
skainet-compile-dag = { module = "sk.ainet.core:skainet-compile-dag", version.ref = "skainet" }
skainet-backend-cpu = { module = "sk.ainet.core:skainet-backend-cpu", version.ref = "skainet" }
skainet-data-api = { module = "sk.ainet.core:skainet-data-api", version.ref = "skainet" }
skainet-data-simple = { module = "sk.ainet.core:skainet-data-basic", version.ref = "skainet" }
skainet-io-core = { module = "sk.ainet.core:skainet-io-core", version.ref = "skainet" }
skainet-io-gguf = { module = "sk.ainet.core:skainet-io-gguf", version.ref = "skainet" }
skainet-io-onnx = { module = "sk.ainet.core:skainet-io-onnx", version.ref = "skainet" }



[plugins]
jetbrainsKotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow-jar = { id = "com.gradleup.shadow", version.ref = "shadow" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.36.0" }
jetbrains-dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
jupyter-api = { id = "org.jetbrains.kotlin.jupyter.api", version.ref = "kotlinJupyter" }